name: Bootstrap Terraform State

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: choice
        options: [plan, apply]
      state_bucket_name:
        description: Globally unique S3 bucket name for Terraform state
        required: true
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: terraform-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize Terraform for first state-bucket creation
        if: vars.TF_STATE_BUCKET == ''
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false
      - name: Initialize Terraform from remote state
        if: vars.TF_STATE_BUCKET != ''
        working-directory: infra/bootstrap
        run: |
          terraform init -reconfigure -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Plan state bucket
        if: inputs.operation == 'plan'
        working-directory: infra/bootstrap
        run: terraform plan -no-color -input=false -var="state_bucket_name=${{ inputs.state_bucket_name }}" -var="aws_region=${{ vars.AWS_REGION }}"
      - name: Create state bucket
        if: inputs.operation == 'apply'
        working-directory: infra/bootstrap
        run: terraform apply -auto-approve -input=false -var="state_bucket_name=${{ inputs.state_bucket_name }}" -var="aws_region=${{ vars.AWS_REGION }}"
      - name: Migrate bootstrap state into S3
        if: inputs.operation == 'apply' && vars.TF_STATE_BUCKET == ''
        working-directory: infra/bootstrap
        run: |
          terraform init -migrate-state -force-copy -reconfigure -input=false \
            -backend-config="bucket=${{ inputs.state_bucket_name }}" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Store state bucket name in GitHub Variables
        if: inputs.operation == 'apply'
        uses: actions/github-script@v7
        env:
          STATE_BUCKET: ${{ inputs.state_bucket_name }}
        with:
          script: |
            await github.rest.actions.createOrUpdateRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "TF_STATE_BUCKET",
              value: process.env.STATE_BUCKET
            });
